name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & verify
        run: ./mvnw -B verify

  e2e:
    name: Bruno end-to-end (SSO stack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add keycloak host alias
        run: sudo bash -c 'echo "127.0.0.1 keycloak" >> /etc/hosts'

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Start the SSO stack
        run: docker compose -f sso-stack/docker-compose.yml up -d

      - name: Wait for Keycloak realm to be seeded
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://keycloak:8080/auth/realms/testrealm/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak realm testrealm is ready"; exit 0
            fi
            sleep 3
          done
          echo "Keycloak realm did not become ready in time"
          docker compose -f sso-stack/docker-compose.yml logs --tail 200
          exit 1

      - name: Build and start the service
        run: |
          set -a && source sso-stack/local-docker.env && set +a
          ./mvnw -B install -DskipTests
          ./mvnw -B -f cockpit-sso-service/pom.xml spring-boot:run > app.log 2>&1 &

      - name: Wait for the service to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8082/; then
              echo "Service is up"; exit 0
            fi
            sleep 3
          done
          echo "Service did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        run: npx --yes @usebruno/cli@4.0.0 run bruno --env Local -r

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== app.log ====="; tail -n 300 app.log || true
          echo "===== docker compose logs ====="
          docker compose -f sso-stack/docker-compose.yml logs --tail 200 || true
